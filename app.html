    function pulsoScatter(p25, p50, p75, n, seed) {
      const points = [];
      const rng = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      for (let i = 0; i < n; i++) {
        const u = rng();
        let val;
        if (u < 0.25) val = p25 - (p25 - p25 * 0.7) * rng();
        else if (u < 0.75) val = p25 + (p75 - p25) * rng();
        else val = p75 + (p75 * 0.3) * rng();
        points.push(Math.round(val));
      }
      return points;
    }

    function RoleDetail({ setNav, selectedRoleId, period, lang }) {
      const t = STRINGS[lang];
      const r = PULSO_ROLES.find(x => x.id === selectedRoleId) || PULSO_ROLES[2];
      const pm = period === 'annual' ? 12 : 1;
      const periodSuffix = t.periodSuffix[period];
      const scatter = useMemo(() => pulsoScatter(r.p25, r.p50, r.p75, r.n, r.id.length), [r]);
      const max = Math.max(...scatter, r.p75*1.3), min = Math.min(...scatter, r.p25*0.7);
      const BINS = 18;
      const hist = useMemo(() => {
        const b = Array(BINS).fill(0);
        scatter.forEach(v => { const idx = Math.min(BINS-1, Math.floor(((v-min)/(max-min))*BINS)); b[idx]++; });
        return b;
      }, [scatter, min, max]);
      const hmax = Math.max(...hist);
      const mine = 5400;
      const minePct = Math.round((mine - r.p50) / r.p50 * 100);
      const mineAbove = minePct >= 0;
      const mineDelta = `${Math.abs(minePct)}% ${mineAbove ? t.aboveP50 : t.belowP50}`;
      const mineTone = mineAbove ? 'good' : 'bad';

      return (
        <div style={{ padding: '24px 28px 60px' }}>
          <button onClick={() => setNav('comp')} style={{ background:'transparent', border:'none', fontSize:12, color:S.inkMuted, cursor:'pointer', padding:0, marginBottom:10 }}>{t.backExplorer}</button>
          <div style={{ display:'flex', alignItems:'baseline', gap:10, marginBottom:3 }}>
            <div style={{ fontSize:22, fontWeight:600, color:S.ink, letterSpacing:-0.3 }}>{r.role}</div>
            <span style={{ fontSize:11, padding:'2px 7px', background:S.chipBg, color:S.inkSoft, borderRadius:4, fontWeight:500 }}>{r.level}</span>
            <span style={{ fontSize:11, padding:'2px 7px', background:S.accentSoft, color:S.accent, borderRadius:4, fontWeight:500 }}>{r.fn}</span>
          </div>
          <div style={{ fontSize:13, color:S.inkMuted, marginBottom:20 }}>{r.n} {t.dataPoints} · {PULSO_PEERS.length*6} {t.peerCompanies} · {t.updatedAgo}</div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14, marginBottom:22 }}>
            {[
              { label:`P25 ${periodSuffix}`,          value:`$${Math.round(r.p25*pm).toLocaleString()}` },
              { label:`Median (P50) ${periodSuffix}`, value:`$${Math.round(r.p50*pm).toLocaleString()}` },
              { label:`P75 ${periodSuffix}`,          value:`$${Math.round(r.p75*pm).toLocaleString()}` },
              { label:t.yourOffer,                     value:`$${Math.round(mine*pm).toLocaleString()}`, delta: mineDelta, tone: mineTone },
            ].map((s,i) => (
              <div key={i} style={{ padding:16, background:S.surface, border:`1px solid ${i===3?(mineAbove?S.good:S.bad):S.line}`, borderRadius:8 }}>
                <Stat {...s} />
              </div>
            ))}
          </div>

          <div style={{ padding:22, background:S.surface, border:`1px solid ${S.line}`, borderRadius:8 }}>
            <div style={{ fontSize:14, fontWeight:600, color:S.ink, marginBottom:14 }}>{t.distribution}</div>
            <div style={{ display:'flex', alignItems:'flex-end', gap:3, height:110, marginBottom:6 }}>
              {hist.map((h,i) => {
                const v = (i/BINS)*(max-min)+min;
                const inBand = v>=r.p25 && v<=r.p75;
                return <div key={i} style={{ flex:1, height:`${Math.max(4,(h/hmax)*110)}px`, background:inBand?S.accent:S.accentDim, borderRadius:'2px 2px 0 0' }} />;
              })}
            </div>
            <div style={{ position:'relative', height:36, marginTop:2 }}>
              <div style={{ position:'absolute', top:0, left:0, right:0, height:1, background:S.line }} />
              {[{v:r.p25,l:'P25'},{v:r.p50,l:'P50'},{v:r.p75,l:'P75'},{v:mine,l:'You',h:true}].map((m,i) => {
                const left = ((m.v-min)/(max-min))*100;
                return (
                  <div key={i} style={{ position:'absolute', top:0, left:`${left}%`, transform:'translateX(-50%)', textAlign:'center' }}>
                    <div style={{ width:1, height:8, background:m.h?S.ink:S.inkFaint, margin:'0 auto' }} />
                    <div style={{ fontSize:10, color:m.h?S.ink:S.inkMuted, fontWeight:m.h?600:500, marginTop:3 }}>{m.l}</div>
                    <div style={{ fontSize:10, fontFamily:S.mono, color:S.inkMuted }}>${Math.round(m.v*pm).toLocaleString()}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginTop:20 }}>
            <div style={{ padding:18, background:S.surface, border:`1px solid ${S.line}`, borderRadius:8 }}>
              <div style={{ fontSize:14, fontWeight:600, color:S.ink, marginBottom:12 }}>{t.pkgComp}</div>
              {t.pkg.map((l,i) => { const [pct,val] = [[78,r.p50],[12,732],[7,427],[3,183]][i]; const v = `$${Math.round(val*pm).toLocaleString()}`; return (
                <div key={i} style={{ display:'grid', gridTemplateColumns:'80px 1fr 50px 70px', gap:12, alignItems:'center', padding:'8px 0', borderBottom:i<3?`1px solid ${S.lineSoft}`:'none' }}>

                  </div>
                  <div style={{ fontFamily:S.mono, fontSize:11, color:S.inkMuted }}>{p.size}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

              <div style={{ display:'flex', justifyContent:'flex-end', gap:8, marginTop:16 }}>
                <button onClick={()=>setStep(1)} style={{ padding:'9px 14px', background:S.surface, color:S.ink, border:`1px solid ${S.line}`, borderRadius:6, fontSize:13, cursor:'pointer' }}>{t.backBtn}</button>
                <button onClick={()=>setStep(3)} style={{ padding:'9px 14px', background:S.accent, color:'#fff', border:'none', borderRadius:6, fontSize:13, fontWeight:500, cursor:'pointer' }}>{t.continueBtn}</button>
              </div>
            </div>
          )}
          {step===3&&(
            <div>
              <div style={{ padding:22, background:S.surface, border:`1px solid ${S.line}`, borderRadius:8 }}>
                {t.contract.map((x,i,a)=>(
                  <div key={i} style={{ display:'grid', gridTemplateColumns:'20px 1fr', gap:12, padding:'10px 0', borderBottom:i<a.length-1?`1px solid ${S.lineSoft}`:'none' }}>
                    <div style={{ marginTop:5, width:10, height:10, borderRadius:5, background:S.accent }} />
                    <div>
                      <div style={{ fontSize:14, color:S.ink, fontWeight:500 }}>{x.t}</div>
                      <div style={{ fontSize:12, color:S.inkMuted, marginTop:3 }}>{x.d}</div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ display:'flex', justifyContent:'flex-end', gap:8, marginTop:16 }}>
                <button onClick={()=>setStep(2)} style={{ padding:'9px 14px', background:S.surface, color:S.ink, border:`1px solid ${S.line}`, borderRadius:6, fontSize:13, cursor:'pointer' }}>{t.backBtn}</button>
                <button onClick={()=>setStep(4)} style={{ padding:'9px 14px', background:S.accent, color:'#fff', border:'none', borderRadius:6, fontSize:13, fontWeight:500, cursor:'pointer' }}>{t.signBtn}</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Settings({ lang }) {
      const t = STRINGS[lang];
      return (
        <div style={{ padding:'24px 28px 60px', maxWidth:720 }}>
          <div style={{ fontSize:22, fontWeight:600, color:S.ink, letterSpacing:-0.3, marginBottom:16 }}>{t.settingsTitle}</div>
          <div style={{ background:S.surface, border:`1px solid ${S.line}`, borderRadius:8, overflow:'hidden' }}>
            {t.settingsFields.map((x,i,a)=>(
              <div key={i} style={{ display:'grid', gridTemplateColumns:'160px 1fr auto', gap:12, padding:'14px 16px', borderBottom:i<a.length-1?`1px solid ${S.lineSoft}`:'none', alignItems:'center' }}>
                <div style={{ fontSize:11, color:S.inkMuted, fontWeight:600, textTransform:'uppercase', letterSpacing:0.4 }}>{x.k}</div>
                <div style={{ fontSize:13, color:S.ink }}>{x.v}</div>
                <button style={{ fontSize:12, background:'transparent', border:'none', cursor:'pointer', color:S.accent, fontWeight:500 }}>{t.editBtn}</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [nav, setNav] = useState('home');
      const [selectedRoleId, setSelectedRoleId] = useState('eng-sr');
      const [filters, setFilters] = useState({ fn: 'All', level: 'All', country: 'AR' });
      const [period, setPeriod] = useState('monthly');
      const [userRole, setUserRole] = useState('startup');
      const [lang, setLang] = useState('es');
      const showOrg = true;

      useEffect(() => {
        if (!showOrg && (nav === 'org' || nav === 'ratios')) setNav('home');
      }, [showOrg, nav]);

      let content;
      if (nav === 'home')                       content = <Home setNav={setNav} showOrg={showOrg} period={period} userRole={userRole} lang={lang} />;
      else if (nav === 'comp')                  content = <Comp setNav={setNav} setSelectedRoleId={setSelectedRoleId} filters={filters} setFilters={setFilters} period={period} lang={lang} />;
      else if (nav === 'role')                  content = <RoleDetail setNav={setNav} selectedRoleId={selectedRoleId} period={period} lang={lang} />;
      else if (nav === 'bands')                 content = <Bands period={period} lang={lang} />;
      else if (nav === 'org' || nav==='ratios') content = <Org lang={lang} />;
      else if (nav === 'contribute')            content = <Contribute setNav={setNav} lang={lang} />;
      else if (nav === 'settings')              content = <Settings lang={lang} />;

      return (
        <div style={{ display:'grid', gridTemplateColumns:'220px 1fr', minHeight:'100vh', background:S.bg, fontFamily:S.font, color:S.ink }}>
          <Sidebar nav={nav} setNav={setNav} showOrg={showOrg} lang={lang} />
          <div style={{ display:'flex', flexDirection:'column', minHeight:'100%' }}>
            <Topbar nav={nav} period={period} setPeriod={setPeriod} userRole={userRole} setUserRole={setUserRole} lang={lang} setLang={setLang} />
            <div style={{ flex:1, overflow:'auto' }}>{content}</div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
